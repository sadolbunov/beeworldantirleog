sounds:
  entered-combat:
    enabled: false
    name: 'ENTITY_PLAYER_ATTACK_CRIT'
    volume: 1.0
    pitch: 1.0
  left-combat:
    enabled: false
    name: 'ENTITY_EXPERIENCE_ORB_PICKUP'
    volume: 1.0
    pitch: 1.2
