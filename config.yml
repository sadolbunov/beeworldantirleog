      - ' &x&E&5&6&5&3&2ꐁ&r %3'
      - ' &x&E&7&6&D&2&Fꐁ&r %4'
      - ' &x&E&A&7&6&2&Cꐁ&r %5'
      - ' &x&E&C&7&E&2&9ꐀ&r %6'
    '7':
      - ' &x&E&0&5&5&3&9ꐁ&r %1'
      - ' &x&E&2&5&D&3&6ꐁ&r %2'
      - ' &x&E&5&6&5&3&2ꐁ&r %3'
      - ' &x&E&7&6&D&2&Fꐁ&r %4'
      - ' &x&E&A&7&6&2&Cꐁ&r %5'
      - ' &x&E&C&7&E&2&9ꐁ&r %6'
