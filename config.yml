    line: '&f%player&f: &x&F&F&6&E&0&0%health хп'
    empty: '&r'
    '1':
      - ' &x&E&0&5&5&3&9ꐀ&r %1'
    '2':
      - ' &x&E&0&5&5&3&9ꐁ&r %1'
      - ' &x&E&2&5&D&3&6ꐀ&r %2'
    '3':
      - ' &x&E&0&5&5&3&9ꐁ&r %1'
      - ' &x&E&2&5&D&3&6ꐁ&r %2'
      - ' &x&E&5&6&5&3&2ꐀ&r %3'
    '4':
      - ' &x&E&0&5&5&3&9ꐁ&r %1'
      - ' &x&E&2&5&D&3&6ꐁ&r %2'
      - ' &x&E&5&6&5&3&2ꐁ&r %3'
      - ' &x&E&7&6&D&2&Fꐀ&r %4'
    '5':
      - ' &x&E&0&5&5&3&9ꐁ&r %1'
      - ' &x&E&2&5&D&3&6ꐁ&r %2'
      - ' &x&E&5&6&5&3&2ꐁ&r %3'
      - ' &x&E&7&6&D&2&Fꐁ&r %4'
      - ' &x&E&A&7&6&2&Cꐀ&r %5'
    '6':
